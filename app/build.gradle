plugins {
    id 'com.android.application'
}

android {
    namespace 'info.dprktech.androidtoolbox'
    compileSdk 33
    defaultConfig {
        applicationId "info.dprktech.androidtoolbox_ng"
        minSdk 19
        // 22: no runtime permissions on Taeyang (6.0), so sdcard export works without a prompt.
        targetSdk 22
        versionCode 5
        versionName "2.3"
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'uid'
    productFlavors {
        // system: sharedUserId android.uid.system (needed for the serial shell); sign with the platform key.
        system { dimension 'uid' }
        // plain: own uid; privileged only when placed in /system/priv-app.
        plain { dimension 'uid' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
